version: vos.project.v1
build:
  program: cargo
  args:
    - xtask
    - build
  cwd: .
  env:
    - PATH
    - HOME
    - USERPROFILE
    - RUSTUP_HOME
    - CARGO_HOME
    - CARGO_TARGET_DIR
    - CROSS_COMPILE
    - CC_riscv64gc_unknown_none_elf
    - AR_riscv64gc_unknown_none_elf
  timeout: 600000
  artifacts:
    - target/riscv64gc-unknown-none-elf/debug/kernel
    - target/service/hello/hello.bin
runners:
  qemu:
    program: cargo
    args:
      - xtask
      - run
      - --mem
      - 128M
    cwd: .
    env:
      - PATH
      - HOME
      - USERPROFILE
      - RUSTUP_HOME
      - CARGO_HOME
      - CARGO_TARGET_DIR
      - CROSS_COMPILE
      - CC_riscv64gc_unknown_none_elf
      - AR_riscv64gc_unknown_none_elf
    timeout: 120000
    artifacts:
      - disk.img
    success_pattern: GLENDA_BOOT_OK
    failure_pattern: panicked at|Kernel panic
  hardware:
    program: sh
    args:
      - -c
      - echo "hardware evidence is a recorded candidate pending human review"; exit 2
    cwd: .
    env:
      - PATH
    timeout: 5000
    artifacts: []
checks:
  boot-banner-public:
    kind: public
    program: sh
    args:
      - tests/public/verify.sh
      - boot-banner-public
    cwd: .
    env:
      - PATH
      - HOME
      - USERPROFILE
      - RUSTUP_HOME
      - CARGO_HOME
      - CARGO_TARGET_DIR
      - CROSS_COMPILE
      - CC_riscv64gc_unknown_none_elf
      - AR_riscv64gc_unknown_none_elf
    timeout: 180000
    verifies:
      - boot-asm
    artifacts:
      - target/serial-boot.log
  userland-exec-public:
    kind: public
    program: sh
    args:
      - tests/public/verify.sh
      - userland-exec-public
    cwd: .
    env:
      - PATH
      - HOME
      - USERPROFILE
      - RUSTUP_HOME
      - CARGO_HOME
      - CARGO_TARGET_DIR
      - CROSS_COMPILE
      - CC_riscv64gc_unknown_none_elf
      - AR_riscv64gc_unknown_none_elf
    timeout: 180000
    verifies:
      - userland
      - proc
      - interface/syscall-abi
    artifacts:
      - target/serial-userland.log
  userland-evidence-public:
    kind: public
    program: sh
    args:
      - tests/public/verify.sh
      - userland-evidence-public
    cwd: .
    env:
      - PATH
      - HOME
      - USERPROFILE
      - RUSTUP_HOME
      - CARGO_HOME
      - CARGO_TARGET_DIR
      - CROSS_COMPILE
      - CC_riscv64gc_unknown_none_elf
      - AR_riscv64gc_unknown_none_elf
    timeout: 600000
    verifies:
      - userland
      - toolchain
    artifacts:
      - target/service/hello/hello.elf
      - target/service/hello/hello.bin
