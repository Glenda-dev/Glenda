new_invariants:
  - 手动落盘的里程碑树除横幅适配与最小 string.c 修复外不得偏离参考分支 refs/tmp/lab-9 的源码内容
  - GLENDA_BOOT_OK 必须在调度用户代码之前恰好打印一次
  - service/hello/string.c 是学生最小重建，仅提供 memset/memcpy/memmove，不引入任何库依赖
  - 本里程碑保持 candidate 语义：缺少物理板证据与人工评审前不得升级为 complete
