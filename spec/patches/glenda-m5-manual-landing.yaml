id: glenda-m5-manual-landing
reason: >-
  M5（用户态，candidate）按课程预案手动落盘：学生参考实现 refs/tmp/lab-9 在 M4
  基础上补齐可运行队列、文件文件描述符层、dentry 缓存重构与 LAB-9 用户态自检。
  Agent 所有权边界无法一次性覆盖 userland、proc、fs 多个模块的 owns 路径，故由
  学生手动将该参考树落盘为本 orphan 里程碑树。课程适配与诚实修复共三处：
  （1）lab-9 上游与 lab-8 一样从不打印 LOGO，学生在 kernel/src/main.rs init()
  之后补上 AtomicBool 守卫的一次性横幅块（LOGO + GLENDA_BOOT_OK，printk 不自动
  换行故显式补 \n），单次运行恰好一次且位于调度用户代码之前；
  （2）上游 service/hello/Makefile 的 SRCS 引用了树中不存在的 string.c，导致
  make 直接失败；hello.c 在 -ffreestanding 下需要编译器隐式生成的 memset/memcpy，
  学生补写了最小实现 service/hello/string.c（memset/memcpy/memmove，无外部依赖）
  使 payload 可以链接；
  （3）其余文件与参考分支逐字节一致。学生脚手架从 master 复制，verify.sh 追加
  userland-exec-public 与 userland-evidence-public 两个 case。本次落盘已在宿主
  离线构建并通过 QEMU virt + disk.img(virtio-blk) 启动验证：GLENDA_BOOT_OK 恰好
  一次，内嵌 payload 被调度并跑完全部 LAB-9 自检（[ALL PASS] LAB-9 tests
  completed.）。按课程语义，本里程碑仅为 candidate：物理板证据与人工评审缺失，
  且上游树本身带构建缺口，故标签为 course/glenda-m5-candidate 而非 complete。
