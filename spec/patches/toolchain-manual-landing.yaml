  - vendor/README.md
  - tests/toolchain/workspace_contract.sh
  - tests/toolchain/build_offline.sh
  - tests/toolchain/repro_fuzz.sh
  - tests/toolchain/build_trace.sh
  - vos.yaml
new_invariants:
  - 手动落盘的代码必须来自 Agent worktree 的真实构建产物，且离线复现校验通过后才允许合入 master
  - 本次手动落盘不构成 Agent 提交成功；结构化提交循环仍以 Agent 通过权威校验为准
