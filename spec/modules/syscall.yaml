id: syscall
module: syscall
level: 2
purpose: Own the validated syscall dispatch surface numbered 1-54 with argument copying and error translation.
owns:
- kernel/src/syscall.c
- kernel/src/sysproc.c
- include/syscall.h
- tests/generated/syscall
interface:
- name: syscall_dispatch
  pre:
  - a user trap delivered a syscall ecall with a number in 1-54
  post:
  - the matching handler runs with copied and validated arguments and a signed result returns in the trap frame
  errors:
  - unknown numbers and invalid arguments return a negative result, never a panic
  properties:
  - id: syscall-dispatch-public
    text: each declared number 1-54 resolves to exactly one handler and every handler has a stable target check
- name: argcopy_fetchaddr
  pre:
  - the current process trap frame is valid
  post:
  - integer, pointer, and string arguments are copied from user space with bounds validation
  errors:
  - out-of-range copies fail cleanly and the syscall returns an error
  properties:
  - id: syscall-arg-validation-binding
    text: no handler dereferences a user pointer without a validated copy
properties:
- id: syscall-numbers-stable
  text: handler numbers 1-54 are immutable once published
errors:
- invalid numbers return errors; kernel integrity is never compromised
state:
  stage: syscall-dispatch
  owned_state:
  - the handler dispatch table and per-call argument scratch state
  resource_lifetime:
  - the dispatch table lives for the kernel lifetime
preconditions:
- proc has delivered a valid user trap frame
postconditions:
- fs and proc services are reachable only through validated handlers
invariants:
- id: syscall-no-raw-user-deref
  text: user memory is only touched through copy routines declared by this module
dependencies:
- proc
- fs
- toolchain
