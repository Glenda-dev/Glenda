id: dtb
module: dtb
level: 2
purpose: Parse the firmware-provided flattened device tree to discover physical memory ranges, the UART configuration, and the hart topology before memory initialization.
owns:
- kernel/src/dtb.rs
- tests/generated/dtb
interface:
- name: dtb_init
  pre:
  - OpenSBI passes the DTB physical address in the boot register contract
  post:
  - physical memory top, the UART configuration, and the hart count are published as immutable discovery results
  errors:
  - a malformed or missing device tree returns a typed error and the boot path falls back to the QEMU virt defaults
  properties:
  - id: dtb-memory-discovery-public
    text: the discovered memory range matches the QEMU virt configured RAM and gates the physical allocator
properties:
- id: dtb-immutable-discovery
  text: discovery results never change after dtb_init returns
errors:
- structure corruption surfaces a typed error rather than panicking before uart fallback
state:
  stage: early-boot
  owned_state:
  - the parsed device tree view and the published memory, UART, and hart discovery results
  resource_lifetime:
  - discovery results live for the kernel lifetime; the tree view may be dropped after discovery
preconditions:
- the DTB blob is readable at the address handed off by firmware
postconditions:
- mem and uart modules consume only the published discovery results
invariants:
- id: dtb-discovery-once
  text: discovery runs exactly once before the physical allocator starts
dependencies:
- boot-asm
- toolchain
