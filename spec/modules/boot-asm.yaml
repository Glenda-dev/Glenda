id: boot-asm
module: boot-asm
level: 1
purpose: Enter from OpenSBI on the boot hart, set the early stack, and publish the deterministic GLENDA_BOOT_OK banner before any scheduling.
owns:
- kernel/src/asm/boot.S
- kernel/src/main.rs
- kernel/src/printk.rs
- kernel/src/lock.rs
- kernel/src/logo.rs
- kernel/src/sbi.rs
- kernel/src/init/harts.rs
- kernel/src/init/mod.rs
- kernel/src/linker.ld
- tests/generated/boot-asm
interface:
- name: boot_banner
  pre:
  - OpenSBI has entered the linked supervisor image with interrupts disabled
  post:
  - the boot hart prints the literal line GLENDA_BOOT_OK exactly once before scheduling user code
  errors:
  - an invalid early stack or trap-vector address faults before the banner
  properties:
  - id: boot-banner-public
    text: a single uninterrupted QEMU virt run observes exactly one GLENDA_BOOT_OK line as the runtime banner oracle
- name: early_console
  pre:
  - the uart driver has been initialized from the device-tree discovery or the QEMU virt fallback
  post:
  - every printk byte reaches the ns16550 UART through the single uart driver path; SBI ecalls are reserved for timer, IPI, and hart services
  errors:
  - console writes before uart initialization are dropped rather than corrupting device state
  properties:
  - id: boot-console-binding
    text: printk routes all console bytes through the uart driver declared by the uart module, and the GLENDA_BOOT_OK literal is referenced by the boot path
- name: sbi_services
  pre:
  - the SBI implementation is present in firmware
  post:
  - timer, IPI, and hart services cross to firmware only through the declared sbi-ecall interface
  errors:
  - unavailable SBI extensions surface a firmware error code
  properties:
  - id: boot-sbi-services-binding
    text: kernel timer programming uses sbi_set_timer and never writes CLINT registers directly from driver code
properties:
- id: boot-deterministic-banner
  text: the boot hart reaches GLENDA_BOOT_OK deterministically under the boot-banner-public oracle
errors:
- early entry faults panic with a diagnostic rather than looping
dependencies:
- uart
- dtb
- toolchain
