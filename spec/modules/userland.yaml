id: userland
module: userland
level: 2
purpose: Own the embedded C hello payload, its build rules, and the first-user-process entry that exercises the syscall surface end to end.
owns:
- service/hello
- tests/generated/userland
interface:
- name: load_payload
  pre:
  - the payload image is embedded at build time and a process slot is current
  post:
  - the first user process starts from the payload entry with a fresh user stack and valid trap frame
  errors:
  - a malformed embedded payload image fails boot with a diagnostic
  properties:
  - id: userland-exec-public
    text: the embedded payload reaches user mode and issues its declared syscall sequence
- name: hello_payload_main
  pre:
  - the payload is executing in user mode
  post:
  - the payload writes its deterministic evidence line through the write syscall and exits with a documented status
  errors:
  - invalid syscall results are reported through the exit status, never a kernel panic
  properties:
  - id: userland-evidence-public
    text: a single QEMU run captures the payload evidence line and the clean exit status
properties:
- id: userland-single-payload
  text: exactly one embedded payload image is loaded by the init process
errors:
- payload format violations fail boot cleanly
state:
  stage: user-execution
  owned_state:
  - the payload build outputs and the embedded image layout
  resource_lifetime:
  - the payload image is immutable after build; process state follows the proc lifecycle
preconditions:
- syscall dispatch and proc lifecycle are published
postconditions:
- the milestone runtime evidence ends with the payload exit status
invariants:
- id: userland-privilege-crossing
  text: the payload crosses privilege only through the trampoline trap frame
dependencies:
- proc
- syscall
- toolchain
