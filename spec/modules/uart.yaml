id: uart
module: uart
level: 2
purpose: Own the ns16550 UART driver at 0x10000000 with interrupt-driven input and polled output for the kernel console.
owns:
- kernel/src/uart.c
- include/uart.h
- tests/generated/uart
interface:
- name: uart_init
  pre:
  - the UART MMIO range is mapped and reachable
  post:
  - the device is configured for 8-bit transfer and its interrupt is enabled at the PLIC
  errors:
  - register access faults panic with a diagnostic
  properties:
  - id: uart-byte-registers
    text: the ns16550 is accessed as byte-addressed MMIO with THR at offset 0 and LSR at offset 5, bit 5 transmitter ready
- name: uart_putc
  pre:
  - uart_init has completed
  post:
  - the byte is written after transmitter readiness is observed
  errors:
  - a stuck transmitter falls back to dropping with a diagnostic after a bounded poll
  properties:
  - id: uart-output-public
    text: console bytes written through uart_putc are observable on the QEMU serial stream
- name: uart_intr
  pre:
  - the PLIC reports the UART IRQ
  post:
  - every pending input byte is moved to the console input buffer and echoed
  errors:
  - input buffer exhaustion drops bytes rather than blocking interrupt context
  properties:
  - id: uart-input-drain
    text: interrupt handling drains the receiver FIFO completely before returning
properties:
- id: uart-single-driver
  text: exactly one driver instance owns the UART registers for the kernel lifetime
errors:
- device absence panics with a diagnostic at initialization
state:
  stage: device-driver
  owned_state:
  - the UART register page mapping and the console input ring buffer
  resource_lifetime:
  - the mapping and ring live for the kernel lifetime
preconditions:
- kernel virtual memory mappings for the UART range exist
postconditions:
- kernel printk and console input operate through this driver only
invariants:
- id: uart-identity-single
  text: no second driver instance maps or writes the UART register page
dependencies:
- boot-asm
- irq
- toolchain
