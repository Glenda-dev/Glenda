id: uart
module: uart
level: 2
purpose: Own the ns16550 UART driver crate with polled output and interrupt-driven input for the kernel console.
owns:
- drivers/Cargo.toml
- drivers/src
- tests/generated/uart
interface:
- name: uart_init
  pre:
  - a UART configuration is supplied from device-tree discovery or the QEMU virt fallback
  post:
  - the device is configured for 8-bit transfer and reachable MMIO registers are validated
  errors:
  - register access faults panic with a diagnostic
  properties:
  - id: uart-byte-registers
    text: the ns16550 is accessed as byte-addressed MMIO with the configured THR and LSR offsets from the device tree
- name: uart_putc
  pre:
  - uart_init has completed
  post:
  - the byte is written after transmitter readiness is observed
  errors:
  - a stuck transmitter falls back to dropping with a diagnostic after a bounded poll
  properties:
  - id: uart-output-public
    text: console bytes written through uart_putc are observable on the QEMU serial stream
- name: uart_intr
  pre:
  - the interrupt controller reports the UART IRQ
  post:
  - every pending input byte is moved to the console input buffer
  errors:
  - input buffer exhaustion drops bytes rather than blocking interrupt context
  properties:
  - id: uart-input-drain
    text: interrupt handling drains the receiver FIFO completely before returning
properties:
- id: uart-single-driver
  text: exactly one driver instance owns the UART registers for the kernel lifetime
errors:
- device absence panics with a diagnostic at initialization
state:
  stage: device-driver
  owned_state:
  - the UART register mapping and the console input ring buffer
  resource_lifetime:
  - the mapping and ring live for the kernel lifetime
preconditions:
- dtb discovery has published the UART base or the QEMU virt fallback applies
postconditions:
- kernel printk operates through this driver only
invariants:
- id: uart-identity-single
  text: no second driver instance maps or writes the UART register range
dependencies:
- dtb
- toolchain
