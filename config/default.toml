# Lib
[[libraries]]
name = "libglenda-rs"
path = "lib/libglenda-rs"
build = "cargo"
output = ""
[[libraries]]
name = "libape"
path = "lib/libape"
build = "cargo"
output = ""
[[libraries]]
name = "libglenda"
path = "lib/libglenda"
build = "cmake"
output = "build/libglenda.a"
[[libraries]]
name = "musl-glenda"
path = "lib/musl-glenda"
build = "make"
output = "lib/libc.a"

[[files]]
name = "init.json"
path = "config/init.json"
[[files]]
name = "drivers.json"
path = "config/drivers.json"
[[files]]
name = "fs.json"
path = "config/fs.json"
[[files]]
name = "network.json"
path = "config/network.json"
[[files]]
name = "tty.json"
path = "config/tty.json"

[features]
kernel = []
libglenda-rs = ["rt-bare"]
musl-glenda = ["--disable-shared", "--prefix=../../target/sysroot"]
