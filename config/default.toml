[system]
arch = "riscv64"
profile = "release"

[qemu]
cpus = 1
mem = "2G"
display = "nographic"
drive = "disk.img"
bootargs = "-v"

[[services]]
name = "warren"
path = "service/warren"
build = "cargo"
output = "build/warren.elf"
kind = "root_task"
[[services]]
name = "nineball"
path = "service/nineball"
build = "cargo"
output = "build/nineball.elf"
kind = "service"
[[services]]
name = "unicorn"
path = "service/unicorn"
build = "cargo"
output = "build/unicorn.elf"
kind = "service"
[[services]]
name = "goldfish-rtc"
path = "drivers/timer/goldfish-rtc"
build = "cargo"
output = "build/goldfish-rtc.elf"
kind = "service"
[[services]]
name = "ns16550a"
path = "drivers/uart/ns16550a"
build = "cargo"
output = "build/ns16550a.elf"
kind = "service"
[[services]]
name = "virtio-blk"
path = "drivers/virtio/block"
build = "cargo"
output = "build/virtio-blk.elf"
kind = "service"
[[services]]
name = "virtio-net"
path = "drivers/virtio/net"
build = "cargo"
output = "build/virtio-net.elf"
kind = "service"
[[services]]
name = "extfs"
path = "fs/extfs"
build = "cargo"
output = "build/extfs.elf"
kind = "service"
[[services]]
name = "fatfs"
path = "fs/fatfs"
build = "cargo"
output = "build/fatfs.elf"
kind = "service"
[[services]]
name = "ape"
path = "service/ape"
build = "cargo"
output = "build/ape.elf"
kind = "service"
[[libraries]]
name = "libglenda-rs"
path = "lib/libglenda-rs"
build = "cargo"
output = ""
[[libraries]]
name = "libape"
path = "lib/libape"
build = "cargo"
output = ""
[[libraries]]
name = "libglenda"
path = "lib/libglenda"
build = "cmake"
output = "build/libglenda.a"
[[libraries]]
name = "musl-glenda"
path = "lib/musl-glenda"
build = "make"
output = "lib/libc.a"
[[services]]
name = "sifive-gpio"
path = "drivers/gpio/sifive-gpio"
build = "cargo"
output = "build/sifive-gpio.elf"
kind = "service"
[[services]]
name = "sdhci"
path = "drivers/sdio/sdhci"
build = "cargo"
output = "build/sdhci.elf"
kind = "service"

[[files]]
name = "init.json"
path = "platform/qemu/init.json"
[[files]]
name = "drivers.json"
path = "platform/qemu/drivers.json"
[[files]]
name = "fs.json"
path = "platform/qemu/fs.json"


[features]
kernel = []
libglenda-rs = ["rt-bare"]
musl-glenda = ["--disable-shared", "--prefix=../../target"]
