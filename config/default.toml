[system]
arch = "riscv64"
profile = "release"
bootloader = "opensbi"

[qemu]
cpus = 1
mem = "2G"
display = "nographic"
drive = "disk.img"
bootargs = "-v"

# System Services
[[services]]
name = "warren"
path = "service/warren"
build = "cargo"
output = "build/warren.elf"
kind = "root_task"
[[services]]
name = "gopher"
path = "service/gopher"
build = "cargo"
output = "build/gopher.elf"
kind = "service"
[[services]]
name = "nineball"
path = "service/nineball"
build = "cargo"
output = "build/nineball.elf"
kind = "service"
[[services]]
name = "unicorn"
