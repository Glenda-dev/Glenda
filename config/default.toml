[system]
arch = "riscv64"
profile = "relwithdebuginfo"

[qemu]
cpus = 1
mem = "2G"
display = "nographic"
drive = "disk.img"
bootargs = "-v"

[[services]]
name = "warren"
path = "service/warren"
build = "cargo"
output = "build/warren.elf"
kind = "root_task"
[[services]]
name = "nineball"
path = "service/nineball"
build = "cargo"
output = "build/nineball.elf"
kind = "service"
[[services]]
name = "unicorn"
path = "service/unicorn"
build = "cargo"
output = "build/unicorn.elf"
kind = "service"
[[services]]
name = "ape"
path = "service/ape"
build = "cargo"
output = "build/ape.elf"
kind = "service"
[[libraries]]
name = "libglenda-rs"
path = "lib/libglenda-rs"
build = "cargo"
output = ""
[[libraries]]
name = "libape"
path = "lib/libape"
build = "cargo"
output = ""
[[libraries]]
name = "libglenda"
path = "lib/libglenda"
build = "cmake"
output = "build/libglenda.a"
[[libraries]]
name = "musl-glenda"
path = "lib/musl-glenda"
build = "make"
output = "lib/libc.a"
[features]
kernel = []
libglenda-rs = ["rt-bare"]
musl-glenda = ["--disable-shared", "--prefix=../../target"]
