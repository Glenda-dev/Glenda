[system]
arch = "riscv64"
profile = "relwithdebuginfo"

[qemu]
cpus = 1
mem = "1G"
display = "nographic"
bootargs = "-s"
drive = "disk.img"

[[services]]
name = "hello"
path = "examples/hello"
build = "cargo"
output = "build/hello.elf"
kind = "root_task"
[[libraries]]
name = "libglenda-rs"
path = "lib/libglenda-rs"
build = "cargo"
[features]
kernel = []
libglenda-rs = ["rt-bare"]
