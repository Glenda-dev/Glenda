[system]
arch = "riscv64"
profile = "relwithdebuginfo"

[qemu]
cpus = 1
mem = "2G"
display = "nographic"
drive = "disk.img"

[[services]]
name = "factotum"
path = "service/factotum"
build = "cargo"
output = "build/factotum.elf"
kind = "root_task"
[[services]]
name = "nineball"
path = "service/nineball"
build = "cargo"
output = "build/nineball.elf"
kind = "root_task"
[[libraries]]
name = "libglenda-rs"
path = "lib/libglenda-rs"
build = "cargo"
[features]
kernel = []
libglenda-rs = ["rt-bare"]
